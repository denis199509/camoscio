<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camoscio - Accesso Demo</title>
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="demo-page-body">
    <div class="demo-page-card">
        <div class="lang-switcher" role="group" aria-label="Lingua / Language" style="justify-content:center;margin-bottom:10px;">
            <button type="button" class="lang-flag-btn" data-lang="it" title="Italiano" aria-label="Italiano" aria-pressed="true">
                <svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#009246"/><rect width="1" height="2" x="1" fill="#fff"/><rect width="1" height="2" x="2" fill="#ce2b37"/></svg>
            </button>
            <button type="button" class="lang-flag-btn" data-lang="en" title="English" aria-label="English" aria-pressed="false">
                <svg viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#00247d"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/></svg>
            </button>
        </div>
        <span class="demo-badge" data-i18n="demoPage.badge">Modalità demo / test</span>
        <h2><img src="img/logo.png" alt="Camoscio" class="logo-icon logo-icon-img"> CAMOSCIO</h2>
        <p class="text-muted" style="margin-top:10px;" data-i18n="demoPage.intro">
            Questi 4 account esistono solo per provare rapidamente il sito, senza registrarti.
            Non sono account reali: qualunque modifica fatta qui è visibile a chiunque usi la demo.
        </p>

        <div class="demo-accounts-grid" id="demo-accounts-grid">
            <!-- Popolato da JS -->
        </div>

        <p class="auth-switch-row">
            <span data-i18n="demoPage.wantReal">Vuoi un account vero e tutto tuo?</span> <a href="/" class="auth-link" data-i18n="demoPage.backToLogin">Torna alla pagina di login/registrazione</a>
        </p>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/i18n.js"></script>
    <script>
        var T = (window.CamoscioI18n && window.CamoscioI18n.t) || function () { return null; };

        window.showToast = function (message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast error';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        // Un account demo non ha password: chiunque puo' farvi accesso e, da li', rinominarsi
        // (campo username, normalmente modificabile dal proprio profilo). Senza questo escaping
        // un nome scelto apposta con HTML dentro avvelenerebbe questa pagina pubblica per
        // chiunque la visiti dopo (bug trovato in Fase H, caccia ai bug generale).
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function loadDemoAccounts() {
            const grid = document.getElementById('demo-accounts-grid');
            try {
                const res = await fetch('/api/auth/demo-accounts');
                const accounts = await res.json();
                grid.innerHTML = accounts.map(u => `
                    <div class="demo-account-btn" data-id="${u.id}">
                        <span class="demo-avatar">${escapeHtml(u.avatar) || '🥾'}</span>
                        <span class="demo-name">${escapeHtml(u.username)}</span>
                        <span class="demo-level">${escapeHtml(u.experienceLevel) || ''}</span>
                    </div>
                `).join('');

                grid.querySelectorAll('.demo-account-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        try {
                            const r = await fetch('/api/auth/demo-login', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ userId: btn.getAttribute('data-id') })
                            });
                            if (!r.ok) throw new Error('Accesso demo fallito');
                            window.location.href = '/';
                        } catch (e) {
                            showToast(T('demoPage.loginError') || "Impossibile accedere con l'account demo");
                        }
                    });
                });
            } catch (e) {
                grid.innerHTML = '<p class="text-muted">' + (T('demoPage.loadError') || 'Impossibile caricare gli account demo. Il server è avviato?') + '</p>';
            }
        }

        loadDemoAccounts();
    </script>
</body>
</html>
